<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 前端版本哨兵：DevTools 里看 <meta name="ui-version"> 或 document.documentElement.dataset.uiVersion
     就能确认页面是不是当前代码。版本号唯一来源是包根 version.json（/api/version），
     启动时由 js/app.mjs 填进来，这里的空值是「服务没连上」时的诚实状态。 -->
<meta name="ui-version" content="">
<title>PaperLibrary HELIX · 我的文献资料库</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/paperlibrary-icon.png">
<link rel="stylesheet" href="/styles.css">
<!-- 公式排版（KaTeX）：本地 /vendor/katex/，不引外部 CDN；没装 katex 时这两个请求 404，页面照常工作 -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body>
  <div class="app-loading" id="boot">
    <div class="boot-mark"><img src="/paperlibrary-mark.png" alt="PaperLibrary HELIX" style="width:100%;height:100%;object-fit:contain"></div>
    <p>正在打开你的文献库…</p>
  </div>
  <div id="app" hidden></div>
  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <noscript>这个文献库需要启用 JavaScript 才能使用。</noscript>
  <!-- 唯一入口：模块依赖图由 import 静态表达（P4.5）。
       KaTeX 是可选依赖，由 main.mjs 动态加载，缺失时公式降级为原文显示。 -->
  <script type="module" src="/main.mjs"></script>
</body>
</html>
